  --surface: rgba(255, 255, 255, 0.05);
  --surface-hi: rgba(255, 255, 255, 0.085);
  --surface-lo: rgba(255, 255, 255, 0.03);
  --ink: #F7F7F7;
  --ink-2: #ADADAD;
  --ink-3: #8C8C8C;
  --cream: #FAEDDF;
  --cream-ink: #141414;
  --primary: var(--cream);
  --primary-ink: var(--cream-ink);
  --sel: rgba(250, 237, 223, 0.22);

  --r-panel: 28px;
  --r-surface: 16px;
  --r-pill: 999px;

  --s-1: 4px; --s-2: 8px; --s-3: 12px; --s-4: 16px; --s-5: 24px; --s-6: 32px;

  --ease-out: cubic-bezier(.23, 1, .32, 1);
  --ease-in-out: cubic-bezier(.65, 0, .35, 1);
  --ease-spring: cubic-bezier(.34, 1.35, .64, 1);

  /* token bridge for the impose components */
  --text: var(--ink);
  --text-2: var(--ink-2);
  --text-3: var(--ink-3);
  --bg: var(--panel);
  --hover: rgba(255, 255, 255, 0.045);
  --press: rgba(255, 255, 255, 0.075);
  --border: rgba(255, 255, 255, 0.17);
  --border-soft: rgba(255, 255, 255, 0.07);
  --link: #E8D6C3;
  --ok: #34d399;
  --ok-soft: rgba(52, 211, 153, 0.13);
  --warn: #fbbf24;
  --warn-soft: rgba(251, 191, 36, 0.13);
  --danger: #f87171;
  --danger-soft: rgba(248, 113, 113, 0.13);

  --rail: 272px;
  --measure: 68ch;
}

@property --p { syntax: "<number>"; inherits: false; initial-value: 0; }

*{box-sizing:border-box}
html{ -webkit-text-size-adjust:100%; }

body{
  margin:0;
  background:var(--canvas);
  color:var(--ink);
  font:400 1rem/1.6 var(--sf);
  font-optical-sizing:auto;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  overflow:hidden;
}
::selection{ background:var(--sel) }
button{ font:inherit; color:inherit; background:none; border:0; padding:0; cursor:pointer }
:where(button, a, textarea):focus-visible{ outline:none }
svg{ display:block }

/* ---------------------------------------------------------------- shell */
.app{
  display:grid;
  grid-template-columns:var(--rail) minmax(0, 1fr);
  gap:var(--s-2);
  height:100dvh;
  padding:var(--s-2);
  transition:grid-template-columns 460ms var(--ease-spring);
}
.app[data-rail="closed"]{ grid-template-columns:0 minmax(0, 1fr); }
.app[data-rail="closed"] .rail{ opacity:0; pointer-events:none; }

.rail{
  min-width:0; overflow:hidden;
  display:flex; flex-direction:column;
  gap:var(--s-2);
  padding:var(--s-4) var(--s-2);
  transition:opacity 200ms linear;
}
.rail-inner{ width:calc(var(--rail) - var(--s-4)); height:100%; display:flex; flex-direction:column; gap:var(--s-2); }
.rail-top{ display:flex; align-items:center; gap:var(--s-2); }
.icon.rail-close{ display:none; flex:0 0 auto; }

.new-chat{
  flex:1;
  display:flex; align-items:center; gap:10px;
  block-size:40px; padding-inline:var(--s-3) var(--s-4);
  border-radius:var(--r-pill);
  background:var(--primary); color:var(--primary-ink);
  font-size:0.9375rem; font-weight:500; letter-spacing:-0.011em;
  transition:opacity 140ms linear, transform 140ms var(--ease-out);
}
.new-chat:hover{ opacity:.92 }
.new-chat:active{ transform:scale(.985) }
.new-chat svg{ inline-size:17px; block-size:17px; }

.rail-search{
  display:flex; align-items:center; gap:8px;
  block-size:34px; margin-block-end:var(--s-2);
  padding-inline:var(--s-3);
  border-radius:var(--r-pill);
  background:var(--surface-lo);
  transition:background 160ms linear;
}
.rail-search:focus-within{ background:var(--surface) }
.rail-search svg{ inline-size:15px; block-size:15px; flex:none; color:var(--ink-3) }
.rail-search input{
  flex:1; min-width:0;
  background:none; border:0; margin:0; padding:0;
  color:var(--ink); font:inherit; font-size:0.875rem; letter-spacing:-0.006em;
}
.rail-search input::placeholder{ color:var(--ink-3) }
.rail-search input:focus{ outline:none }

.history{ flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column; gap:1px; scrollbar-width:none; }
.history::-webkit-scrollbar{ display:none }
.h-group{
  padding:var(--s-3) var(--s-3) var(--s-1);
  font-size:0.75rem; font-weight:500; letter-spacing:0.005em;
  color:var(--ink-3);
}
.conv{
  display:flex; align-items:center; gap:8px;
  inline-size:100%; text-align:start;
  min-block-size:34px; padding:7px var(--s-3);
  border-radius:9px;
  color:var(--ink-2);
  font-size:0.9375rem; line-height:1.4; letter-spacing:-0.008em;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
  transition:background 130ms linear, color 130ms linear;
}
.conv:hover{ background:var(--surface-lo); color:var(--ink) }
.conv .conv-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.conv .conv-star{ flex:none; display:flex; color:var(--ink-3) }
.conv .conv-star svg{ inline-size:12px; block-size:12px }
.conv[aria-current="true"] .conv-star{ color:var(--cream) }

.empty-history{ padding:var(--s-2) var(--s-3); font-size:0.8125rem; color:var(--ink-3) }
.conv[aria-current="true"]{ background:var(--surface); color:var(--ink); font-weight:500 }
.conv:focus-visible{ background:var(--surface-hi); color:var(--ink) }

.rail-foot{ display:flex; align-items:center; gap:4px; padding-inline:var(--s-1); }
.me-btn{
  flex:1; min-width:0;
  display:flex; align-items:center; gap:10px;
  padding:5px var(--s-2);
  border-radius:10px;
  text-align:start;
  transition:background 140ms linear;
}
.me-btn:hover{ background:var(--surface-lo) }
.me-btn[aria-expanded="true"]{ background:var(--surface) }
.avatar{
  inline-size:26px; block-size:26px; flex:none;
  border-radius:var(--r-pill);
  display:grid; place-items:center;
  background:var(--surface);
  color:var(--ink-2);
  font-size:0.6875rem; font-weight:600; letter-spacing:0.01em;
}
.avatar-me{ inline-size:30px; block-size:30px; background:var(--surface-hi); color:var(--ink) }
.me-meta{ min-width:0; display:flex; flex-direction:column; gap:1px; }
.me-name{ font-size:0.8125rem; font-weight:500; color:var(--ink) }
.me-mode{ font-size:0.75rem; color:var(--ink-3) }

.panel{
  position:relative;
  min-width:0; min-height:0;
  background:var(--panel);
  border-radius:var(--r-panel);
  display:flex; flex-direction:column;
  overflow:hidden;
}

.top{ flex:0 0 auto; display:flex; align-items:center; gap:10px; padding:var(--s-4) var(--s-5); }
.icon{
  display:grid; place-items:center;
  inline-size:30px; block-size:30px; border-radius:var(--r-pill);
  color:var(--ink-2);
  transition:background 130ms linear, color 130ms linear, transform 130ms var(--ease-out);
}
.icon:hover{ background:var(--surface-lo); color:var(--ink) }
.icon:active{ transform:scale(.94) }
.icon:focus-visible{ background:var(--surface-hi); color:var(--ink) }
.icon svg{ inline-size:17px; block-size:17px }
.top-title{
  font-size:0.9375rem; font-weight:500; letter-spacing:-0.011em;
  color:var(--ink); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.top-title:empty::after{ content:"New chat"; color:var(--ink-3) }
.top-spacer{ flex:1 }

.scroll{
  flex:1; min-height:0;
  overflow-y:auto; overscroll-behavior:contain;
  display:flex; flex-direction:column;
  scrollbar-width:none;
  scroll-behavior:smooth;
}
.scroll::-webkit-scrollbar{ display:none }

.thread{
  width:100%;
  max-inline-size:calc(var(--measure) + 3rem);
  margin-inline:auto;
  flex:0 0 auto;
  padding:var(--s-4) var(--s-5) var(--s-6);
  display:flex; flex-direction:column;
  gap:var(--s-5);
}
@media (max-width:720px){ .thread{ padding-inline:var(--s-4); gap:var(--s-4) } }

.turn{ opacity:1; translate:0 0; transition:opacity 340ms var(--ease-out), translate 340ms var(--ease-out) }
@starting-style{ .turn{ opacity:0; translate:0 10px } }

.turn.mine{ display:flex; justify-content:flex-end; align-items:flex-end; gap:8px }
.turn.mine .avatar{ margin-block-end:2px }
.mine-bubble{
  max-inline-size:min(80%, 34rem);
  background:var(--surface);
  border-radius:var(--r-panel);
  border-end-end-radius:10px;
  padding:11px var(--s-4);
  font-size:1rem; line-height:1.58; letter-spacing:-0.006em;
  white-space:pre-wrap; overflow-wrap:anywhere;
}

.bot{ display:flex; flex-direction:column; gap:2px }

/* answer body */
.msg-body{
  font-size:0.96875rem; line-height:1.65; letter-spacing:-0.004em;
  color:var(--ink); margin-block-start:var(--s-2);
}
.msg-body:empty{ display:none }
.msg-body > :first-child{ margin-block-start:0 }
.msg-body > :last-child{ margin-block-end:0 }
.msg-body p{ margin:0 0 var(--s-3); max-inline-size:var(--measure); text-wrap:pretty }
.msg-body ul{ margin:0 0 var(--s-3); padding-inline-start:1.15rem; max-inline-size:var(--measure) }
.msg-body li{ margin-block-end:4px; line-height:1.58 }
.msg-body li::marker{ color:var(--ink-3) }
.msg-body strong{ font-weight:600 }
.msg-body code{ font-family:var(--mono); font-size:0.875em; background:var(--surface-lo); border-radius:6px; padding:0.12em 0.35em }
.msg-body.fade{ animation:body-in 420ms var(--ease-out) both }
@keyframes body-in{ from{ opacity:0; translate:0 6px } to{ opacity:1; translate:0 0 } }

/* streamed answer: the newest characters resolve out of a soft blur */
.stream-tail{
  filter:blur(1.6px);
  -webkit-mask-image:linear-gradient(to right, #000 20%, rgba(0,0,0,.2));
  mask-image:linear-gradient(to right, #000 20%, rgba(0,0,0,.2));
}
.stream-caret{
  display:inline-block;
  inline-size:2px; block-size:1.05em;
  margin-inline-start:1.5px;
  translate:0 -1px;
  border-radius:1px;
  background:var(--ink);
  vertical-align:text-bottom;
  animation:caret-blink 1s step-end infinite;
}
.stream-caret.is-streaming{ animation:none }
@keyframes caret-blink{ 0%,100%{ opacity:1 } 50%{ opacity:0 } }

/* actions */
.bot-acts{
  display:flex; gap:var(--s-2);
  margin-block-start:var(--s-3);
  opacity:0; translate:0 2px;
  transition:opacity 200ms var(--ease-out), translate 200ms var(--ease-out);
}
.turn:hover .bot-acts, .bot-acts:focus-within{ opacity:1; translate:0 0 }
.act{
  display:flex; align-items:center; gap:6px;
  block-size:28px; padding-inline:10px;
  border-radius:var(--r-pill);
  background:var(--surface-lo);
  color:var(--ink-2); font-size:0.8125rem; letter-spacing:-0.005em;
  transition:background 130ms linear, color 130ms linear, transform 130ms var(--ease-out);
}
.act:hover{ background:var(--surface); color:var(--ink) }
.act:active{ transform:scale(.97) }
.act:focus-visible{ background:var(--surface-hi); color:var(--ink) }
.act svg{ inline-size:14px; block-size:14px }

/* empty */
.blank{ flex:1; display:flex; align-items:center; padding:var(--s-6) var(--s-5) var(--s-6) }
.blank-inner{
  inline-size:100%;
  max-inline-size:calc(var(--measure) + 3rem);
  margin-inline:auto;
  display:flex; flex-direction:column; gap:var(--s-3);
}
.blank h1{
  margin:0;
  font-size:clamp(1.875rem, 3.1vw, 2.625rem);
  font-weight:500; line-height:1.04; letter-spacing:-0.033em;
  max-inline-size:18ch; text-wrap:balance;
}
.blank p{
  margin:0; color:var(--ink-2);
  font-size:1.03125rem; line-height:1.55; letter-spacing:-0.005em;
  max-inline-size:44ch; text-wrap:pretty;
}
.prompts{ display:flex; flex-wrap:wrap; gap:var(--s-2); margin-block-start:var(--s-3) }
.prompt{
  display:flex; align-items:center; gap:7px;
  block-size:34px; padding-inline:var(--s-3) var(--s-4);
  border-radius:var(--r-pill);
  background:var(--surface);
  color:var(--ink-2);
  font-size:0.875rem; font-weight:500; letter-spacing:-0.008em;
  transition:background 130ms linear, color 130ms linear, transform 130ms var(--ease-out);
}
.prompt svg{ inline-size:15px; block-size:15px; color:var(--ink-3); transition:color 130ms linear }
.prompt:hover{ background:var(--surface-hi); color:var(--ink) }
.prompt:hover svg{ color:var(--ink-2) }
.prompt:active{ transform:scale(.985) }
.prompt:focus-visible{ background:var(--surface-hi); color:var(--ink) }

/* composer */
.dock{
  position:relative; flex:0 0 auto;
  padding:0 var(--s-5) var(--s-4);
  background:var(--panel);
}
.dock::before{
  content:"";
  position:absolute; inset-inline:0; inset-block-end:100%;
  block-size:22px; pointer-events:none;
  background:linear-gradient(to top, var(--panel) 30%, transparent);
}
@media (max-width:720px){ .dock{ padding-inline:var(--s-4); padding-block-end:var(--s-3) } }
.dock-inner{
  max-inline-size:calc(var(--measure) + 3rem);
  margin-inline:auto;
  display:flex; flex-direction:column; gap:var(--s-2);
}
.field{
  display:flex; align-items:flex-end; gap:var(--s-2);
  background:var(--surface);
  border-radius:var(--r-panel);
  padding:var(--s-2);
  padding-inline-start:var(--s-4);
  transition:background 180ms linear;
}
.field[data-focused="1"]{ background:var(--surface-hi) }
.field textarea{
  flex:1; min-width:0;
  background:none; border:0; margin:0; padding-block:6px;
  color:var(--ink); font:inherit; font-size:1rem; line-height:1.5; letter-spacing:-0.006em;
  resize:none; max-block-size:9.5rem; overflow-y:auto;
  field-sizing:content;
}
.field textarea::placeholder{ color:var(--ink-3) }
.field textarea:focus, .field textarea:focus-visible{ outline:none }

.send{
  flex:0 0 auto;
  display:grid; place-items:center;
  inline-size:34px; block-size:34px;
  border-radius:var(--r-pill);
  background:var(--primary); color:var(--primary-ink);
  transition:transform 130ms var(--ease-out), background 150ms linear, color 150ms linear;
}
.send[data-idle="1"]{ background:var(--surface-hi); color:var(--ink-3) }
.send:active{ transform:scale(.92) }
.send:focus-visible{ background:var(--primary); color:var(--primary-ink) }
.send svg{ inline-size:16px; block-size:16px }
.send .stop{ display:none }
.send[data-busy="1"] .arrow{ display:none }
.send[data-busy="1"] .stop{ display:block }

.note{
  margin:0; text-align:center;
  font-size:0.75rem; line-height:1.5; color:var(--ink-3);
  min-block-size:1.125rem;
  transition:color 160ms linear;
}

.scrim{
  position:fixed; inset:0; z-index:10;
  background:rgba(0,0,0,.42);
  opacity:0; pointer-events:none;
  transition:opacity 220ms linear;
}
.app[data-rail="open"] .scrim{ opacity:1; pointer-events:auto }

@media (max-width:900px){
  .app,
  .app[data-rail="open"],
  .app[data-rail="closed"]{ grid-template-columns:minmax(0,1fr); gap:0; padding:0 }
  .panel{ border-radius:0; height:100dvh }
  .rail{
    position:fixed; inset-block:0; inset-inline-start:0; z-index:20;
    inline-size:min(82vw, 300px);
    background:var(--canvas);
    padding:var(--s-4) var(--s-3);
    opacity:1; pointer-events:auto;
    transform:translate3d(-100%, 0, 0);
    will-change:transform;
    transition:transform 380ms var(--ease-spring);
  }
  .app[data-rail="open"] .rail{ transform:none }
  .app[data-rail="closed"] .rail{ opacity:1; pointer-events:auto }
  .icon.rail-close{ display:grid }
}

/* ---------------------------------------------------------------- menus */

.menu-layer{ position:fixed; inset:0; z-index:60 }
.menu{
  position:fixed;
  min-inline-size:216px; max-inline-size:min(300px, calc(100vw - 16px));
  padding:6px;
  border-radius:14px;
  background:#202020;
  animation:menu-in 170ms var(--ease-out) both;
}
@keyframes menu-in{ from{ opacity:0; scale:.955; translate:0 -4px } to{ opacity:1; scale:1; translate:0 0 } }
.menu-label{
  padding:6px 10px 4px;
  font-size:0.75rem; font-weight:500; color:var(--ink-3);
}
.menu-item{
  display:flex; align-items:center; gap:10px;
  inline-size:100%; min-block-size:32px;
  padding:6px 10px;
  border-radius:8px;
  color:var(--ink); font-size:0.875rem; letter-spacing:-0.006em;
  text-align:start;
  transition:background 120ms linear, color 120ms linear;
}
.menu-item svg{ inline-size:15px; block-size:15px; flex:none; color:var(--ink-3); transition:color 120ms linear }
.menu-item .menu-text{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.menu-item .menu-tick{ color:var(--cream) }
.menu-item:hover, .menu-item:focus-visible{ background:var(--surface-hi) }
.menu-item:hover svg, .menu-item:focus-visible svg{ color:var(--ink-2) }
.menu-item.danger{ color:var(--danger) }
.menu-item.danger svg{ color:var(--danger) }
.menu-item[disabled]{ color:var(--ink-3); pointer-events:none }
.menu-sep{ block-size:1px; margin:6px 4px; background:rgba(255,255,255,.07) }
.menu-field{ padding:4px; display:flex; gap:6px }
.menu-field input{
  flex:1; min-width:0;
  block-size:32px; padding-inline:10px;
  border-radius:8px; border:0; margin:0;
  background:var(--surface-lo); color:var(--ink);
  font:inherit; font-size:0.875rem;
}
.menu-field input:focus{ outline:none; background:var(--surface) }
.menu-field button{
  flex:none; block-size:32px; padding-inline:12px;
  border-radius:8px; background:var(--primary); color:var(--primary-ink);
  font-size:0.8125rem; font-weight:500;
}
.menu-row{
  display:flex; align-items:center; gap:10px;
  padding:7px 10px; border-radius:8px;
  font-size:0.875rem; color:var(--ink);
  text-align:start;
  transition:background 120ms linear;
}
.menu-row:hover{ background:var(--surface-hi) }
.menu-row .menu-text{ flex:1; min-width:0; text-align:start }
.menu-row .menu-sub{ display:block; font-size:0.75rem; color:var(--ink-3); margin-block-start:1px }
.menu-row svg{ inline-size:15px; block-size:15px; flex:none; color:var(--ink-3) }

.switch{
  flex:none; position:relative;
  inline-size:34px; block-size:20px;
  border-radius:999px;
  background:var(--surface-hi);
  transition:background 200ms var(--ease-out);
}
.switch::after{
  content:""; position:absolute; inset-block-start:3px; inset-inline-start:3px;
  inline-size:14px; block-size:14px; border-radius:50%;
  background:var(--ink-2);
  transition:transform 240ms var(--ease-spring), background 200ms linear;
}
.switch[aria-checked="true"]{ background:var(--primary) }
.switch[aria-checked="true"]::after{ transform:translateX(14px); background:var(--primary-ink) }

/* motion switch from settings */
html[data-motion="off"] *, html[data-motion="off"] *::before, html[data-motion="off"] *::after{
  animation-duration:1ms !important; animation-iteration-count:1 !important;
  transition-duration:1ms !important;
}

/* ================================================================ impose trace
   Ported from agent/trace.css: hairline ruled plan rows, dot node rail, the
   nine dot loader in the header, conic progress badge, status pills. */

@keyframes trace-in{ from{ opacity:0; transform:translateY(8px) } to{ opacity:1; transform:translateY(0) } }
@keyframes shimmer-text{ from{ background-position:150% center } to{ background-position:-50% center } }
@keyframes pixel-on{ 0%,100%{ opacity:.15 } 18%,42%{ opacity:1 } 62%{ opacity:.15 } }
@keyframes fade-in{ from{ opacity:0 } to{ opacity:1 } }
@keyframes trace-spin{ to{ transform:rotate(360deg) } }
@keyframes trace-settled{ from{ opacity:0 } to{ opacity:1 } }
@keyframes live-pulse{ 0%,100%{ opacity:1; transform:scale(1) } 50%{ opacity:.45; transform:scale(.82) } }
@keyframes prog-slide{ from{ transform:translateX(-110%) } to{ transform:translateX(290%) } }
@keyframes settle-sweep{ from{ background-position:110% 0 } to{ background-position:-30% 0 } }
@keyframes dot-bounce{ 0%,70%,100%{ opacity:.35; translate:0 0 } 35%{ opacity:1; translate:0 -2px } }

.agent-trace{ margin-bottom:6px }

.trace-head{
  display:inline-flex; align-items:center; gap:8px;
  max-width:100%; margin:0;
  padding:6px 9px 6px 5px;
  border:0; border-radius:8px;
  background:none; color:inherit; cursor:pointer;
  text-align:left; vertical-align:top;
  transition:background 160ms linear;
}
.trace-head:hover{ background:var(--hover) }

.pixel-grid{
  display:inline-grid; grid-template-columns:repeat(3, 4px); gap:1.5px;
  flex:none; align-content:center;
}
.pixel-grid span{
  inline-size:4px; block-size:4px; border-radius:1px;
  background:var(--text-3); opacity:.15;
}
.agent-trace:not(.thinking) .pixel-grid{ display:none }
.agent-trace.thinking .trace-glyph .spark{ display:none }

.trace-glyph{
  width:17px; height:17px; flex:none;
  display:flex; align-items:center; justify-content:center;
  color:var(--text-2);
  transition:color 220ms ease;
}
.trace-head:not(.working) .trace-glyph{ color:var(--text-3) }
.trace-glyph svg{ width:17px; height:17px }

.trace-status{
  flex:0 1 auto; min-width:0;
  font-size:0.8125rem; font-weight:500; letter-spacing:-0.008em;
  color:var(--text-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.trace-head.working .trace-status{
  color:transparent;
  background-image:linear-gradient(90deg, var(--text-3) 35%, var(--text) 50%, var(--text-3) 65%);
  background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text;
  animation:shimmer-text 1.4s linear infinite;
}
.trace-head:not(.working) .trace-status{ color:var(--text-2); animation:fade-in 350ms ease-out both }

.trace-time{
  flex:none; margin-left:6px;
  font-family:var(--mono);
  font-size:0.6875rem;
  color:var(--text-3);
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.trace-chev{ flex:none; display:flex; color:var(--text-3) }
.trace-chev svg{ width:14px; height:14px; transition:transform 300ms var(--ease-out) }
.agent-trace:not(.closed) .trace-chev svg{ transform:rotate(180deg) }
.agent-trace.working .trace-chev{ opacity:0; pointer-events:none; transition:opacity 160ms linear }

.trace-body{
  display:grid; grid-template-rows:1fr; opacity:1;
  transition:grid-template-rows 400ms var(--ease-out), opacity 300ms var(--ease-out);
}
.agent-trace.closed .trace-body{ grid-template-rows:0fr; opacity:0 }
.trace-clip{ overflow:hidden; min-height:0 }

/* The stream. Fixed 208px viewport: rows arrive at the bottom and glide up
   under a masked edge instead of pushing the whole page. */
.trace-scroll{
  height:0; overflow-y:auto; overflow-x:hidden;
  scrollbar-width:none;
  transition:height 280ms var(--ease-out);
}
.trace-scroll::-webkit-scrollbar{ display:none }
.trace-scroll.fade-top{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 12px);
  mask-image:linear-gradient(to bottom, transparent 0, #000 12px);
}
.trace-scroll.fade-both{
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 12px, #000 calc(100% - 12px), transparent 100%);
}

/* Trace gutter: a 1px rule at 3px, rows begin at 16px. */
.trace-list{
  position:relative;
  margin-inline-start:5px;
  padding:4px 0 4px 16px;
  transition:transform 320ms var(--ease-out);
}
.trace-rail{
  position:absolute; inset-inline-start:3px; inset-block-start:-8px;
  inline-size:1px; block-size:0;
  background:var(--border-soft);
  transition:height 500ms var(--ease-out);
}

/* One row: 28px minimum, 8px gutters, 6px inline padding, 6px radius. */
.trace-row{
  display:flex; align-items:center; gap:8px;
  min-block-size:28px;
  padding:2px 6px;
  border-radius:6px;
  font-size:0.78125rem; line-height:20px; letter-spacing:-0.002em;
  color:var(--text);
  animation:trace-in 320ms var(--ease-out) both;
  animation-delay:var(--d, 0ms);
}
a.trace-row{ text-decoration:none; color:var(--text) }
.trace-row:hover{ background:var(--hover) }
.trace-row:hover .trace-label{ text-decoration:underline; text-underline-offset:2px; text-decoration-color:var(--text-3) }
.trace-dot{
  inline-size:14px; block-size:14px; flex:none;
  display:grid; place-items:center;
  border-radius:50%;
  background:var(--link); color:var(--canvas);
}
.trace-dot svg{ inline-size:9px; block-size:9px; stroke-width:2.5 }
.trace-dot.t-warn{ background:var(--warn) }
.trace-dot.t-ok{ background:var(--ok) }
.trace-ico{ inline-size:14px; block-size:14px; flex:none; display:grid; place-items:center; color:var(--text-3) }
.trace-ico svg{ inline-size:14px; block-size:14px }
.trace-label{
  min-width:0; font-weight:500;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.trace-query{
  min-width:0; color:var(--text-2);
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.trace-sub{
  flex:none; font-size:0.71875rem; color:var(--text-3);
  white-space:nowrap;
}
.trace-sub.mono, .trace-label.mono{ font-family:var(--mono); font-size:0.71875rem; font-weight:400 }
.trace-diff{
  flex:none; display:flex; gap:4px;
  font-family:var(--mono); font-size:0.6875rem;
  font-variant-numeric:tabular-nums;
}
.trace-diff .add{ color:var(--ok) }
.trace-diff .del{ color:var(--danger) }
.trace-row.live .trace-ico, .trace-row.live .trace-dot{ animation:live-pulse 1.4s ease-in-out infinite }
.trace-more{
  padding:2px 6px;
  font-size:0.75rem; line-height:20px; color:var(--text-3);
  animation:trace-in 320ms var(--ease-out) both;
  animation-delay:var(--d, 0ms);
}
.trace-ring{
  width:12px; height:12px; flex:none;
  border-radius:50%;
  border:1.5px solid var(--border);
  border-top-color:var(--text-2);
  animation:trace-spin 700ms linear infinite;
}

/* ================================================================ plan rows */

.plan-rows{ margin:2px 0 8px; border-top:1px solid var(--border-soft) }
.plan-rows:empty{ display:none }
.plan-row{
  border-bottom:1px solid var(--border-soft);
  animation:trace-in 340ms var(--ease-out) both;
  animation-delay:var(--d, 0ms);
}
.plan-head{
  display:flex; align-items:center; gap:10px;
  width:100%; min-height:40px;
  padding:8px 2px 8px 0;
  border:0; background:none; color:inherit; cursor:pointer; text-align:left;
  border-radius:6px;
  transition:background 140ms linear;
}
.plan-head:hover{ background:var(--hover) }
.plan-badge{
  position:relative;
  width:24px; height:24px; flex:none;
  display:flex; align-items:center; justify-content:center;
  border-radius:50%;
  font-size:0.6875rem; font-variant-numeric:tabular-nums;
  color:var(--text-2);
  background:conic-gradient(var(--link) calc(var(--p, 0) * 1%), var(--border-soft) 0);
  transition:--p 520ms var(--ease-out), color 200ms ease;
}
.plan-badge::after{
  content:"";
  position:absolute; inset:2px;
  border-radius:50%;
  background:var(--bg);
  transition:opacity 200ms ease;
}
.plan-badge > *{ position:relative; z-index:1 }
.plan-badge svg{ width:13px; height:13px }
.plan-badge.pending{ color:var(--text-3) }
.plan-badge.running{ color:var(--text-2) }
.plan-badge.done{ background:var(--ok-soft); color:var(--ok) }
.plan-badge.failed{ background:var(--danger-soft); color:var(--danger) }
.plan-badge.done::after, .plan-badge.failed::after{ opacity:0 }
.plan-label{
  flex:1; min-width:0; color:var(--text);
  font-size:0.84375rem; line-height:20px; letter-spacing:-0.006em;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.plan-meta{ font-size:0.75rem; color:var(--text-3); white-space:nowrap; font-variant-numeric:tabular-nums }
.plan-pills{ display:flex; align-items:center; gap:6px }
.plan-pill{
  font-size:0.71875rem; font-weight:500;
  padding:2px 8px; border-radius:999px;
  white-space:nowrap;
  animation:pill-in 260ms var(--ease-spring) both;
}
@keyframes pill-in{ from{ opacity:0; scale:.85 } to{ opacity:1; scale:1 } }
.plan-pill.done{ background:var(--ok-soft); color:var(--ok) }
.plan-pill.failed{ background:var(--danger-soft); color:var(--danger) }
.plan-pill.running{ background:var(--surface); color:var(--text-2) }
.plan-pill.idle{ background:var(--surface-lo); color:var(--text-3) }
.plan-retry{
  flex:none; display:grid; place-items:center;
  inline-size:22px; block-size:22px; border-radius:50%;
  color:var(--text-3);
  transition:background 140ms linear, color 140ms linear, rotate 300ms var(--ease-out);
}
.plan-retry:hover{ background:var(--surface); color:var(--text) }
.plan-retry:active{ rotate:-40deg }
.plan-retry svg{ inline-size:13px; block-size:13px }
.plan-chev{ display:flex; color:var(--text-3) }
.plan-chev svg{ width:14px; height:14px; transition:transform 260ms var(--ease-out) }
.plan-row.closed .plan-chev svg{ transform:rotate(-90deg) }
.plan-detail{
  display:grid; grid-template-rows:1fr;
  transition:grid-template-rows 300ms var(--ease-out);
}
.plan-row.closed .plan-detail{ grid-template-rows:0fr }
.plan-dbody{ overflow:hidden; min-height:0 }
.plan-dline{
  display:grid; grid-template-columns:minmax(72px, max-content) minmax(0, 1fr);
  align-items:baseline; column-gap:16px;
  padding:6px 8px 6px 34px;
  font-size:0.8125rem; line-height:20px; color:var(--text-2);
}
.plan-dline > span:first-child{ color:var(--text-3) }
.plan-dline > span:last-child{ overflow-wrap:anywhere }
.plan-dline .mono{ font-family:var(--mono); font-size:0.75rem }

/* ---------------------------------------------------------------- evidence
   What an activity actually produced, inside the row that owns it. */

.ev{ padding:4px 8px 10px 34px }
.ev + .ev{ padding-top:0 }
.ev-facts{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:3px 14px; align-items:baseline }
.ev-facts dt{ font-size:0.75rem; color:var(--text-3); white-space:nowrap }
.ev-facts dd{ margin:0; font-size:0.78rem; color:var(--text-2); overflow-wrap:anywhere }
.ev-facts dd.mono{ font-family:var(--mono); font-size:0.75rem }

.ev-row{
  display:grid; grid-template-columns:16px minmax(0,1fr) auto 12px;
  align-items:center; column-gap:8px;
  inline-size:100%; text-align:start;
  min-block-size:28px; padding:4px 2px;
  border-radius:6px;
  font-size:0.8125rem; line-height:20px; color:var(--text-2);
  transition:background 140ms linear, color 140ms linear;
}
.ev-row:hover{ background:var(--hover); color:var(--text) }
.ev-row .i{ display:grid; place-items:center; color:var(--text-3) }
.ev-row .i svg{ inline-size:16px; block-size:16px; stroke-width:1.8 }
.ev-row .t{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap }
.ev-row .m{ font-family:var(--mono); font-size:0.75rem; color:var(--text-3); white-space:nowrap; font-variant-numeric:tabular-nums }
.ev-row .c{ display:grid; place-items:center; color:var(--text-3) }
.ev-row .c svg{ inline-size:11px; block-size:11px; transition:transform 260ms var(--ease-out) }
.ev-row[aria-expanded="true"] .c svg{ transform:rotate(180deg) }
.ev-row[data-state="done"] .i{ color:var(--ok) }
.ev-row[data-state="failed"] .i{ color:var(--danger) }
.ev-row[data-state="skipped"] .i{ color:var(--text-3) }
.ev-row[data-state="running"] .i{ color:var(--warn) }
a.ev-row{ text-decoration:none }

.ev-more{
  display:grid; grid-template-rows:0fr;
  transition:grid-template-rows 300ms var(--ease-out);
}
.ev-more[data-open="1"]{ grid-template-rows:1fr }
.ev-more > div{ overflow:hidden; min-height:0 }

.ev-console{
  margin:6px 0 8px; border-radius:10px;
  background:rgba(0,0,0,.34);
  padding:10px 12px;
}
.ev-console .cmd{ font-family:var(--mono); font-size:0.75rem; color:var(--text); display:flex; gap:6px; align-items:center }
.ev-console .cmd .ps{ color:var(--text-3) }
.ev-console pre{
  margin:6px 0 0; font-family:var(--mono); font-size:0.71875rem; line-height:1.7;
  color:var(--text-2); white-space:pre-wrap; overflow-wrap:anywhere;
  max-height:180px; overflow-y:auto; scrollbar-width:thin;
}
.ev-console pre.err{ color:var(--danger) }
.ev-console .foot{ display:flex; flex-wrap:wrap; gap:4px 12px; margin-top:6px; font-size:0.71875rem; color:var(--text-3) }
.ev-console .foot .bad{ color:var(--danger) }
.ev-console .foot .good{ color:var(--ok) }

.ev-diff{
  margin:4px 0 6px; border-radius:8px;
  background:rgba(0,0,0,.24);
  border:1px solid var(--border-soft);
  max-height:240px; overflow:auto; scrollbar-width:thin;
}
.ev-dline{
  display:grid; grid-template-columns:30px 12px minmax(0,1fr);
  column-gap:8px; padding-inline:8px;
  font-family:var(--mono); font-size:0.71875rem; line-height:1.75;
  color:var(--text-2); white-space:pre;
}
.ev-dline .n{ color:var(--text-3); text-align:right; font-variant-numeric:tabular-nums }
.ev-dline[data-t="add"]{ color:var(--ok); background:rgba(52,211,153,.07) }
.ev-dline[data-t="del"]{ color:var(--danger); background:rgba(248,113,113,.06) }

@media (max-width:720px){
  .plan-dline{ padding-inline-start:34px }
  .ev{ padding-inline:8px 6px 8px 34px }
}


@media (max-width:640px){
  .plan-head{ flex-wrap:nowrap; gap:8px; padding-block:10px; align-items:center }
  .plan-badge{ align-self:center }
  .plan-label{ flex:1 1 auto; white-space:normal; overflow:visible; line-height:1.35 }
  .plan-meta{ display:none }
  .plan-pills{ flex:0 0 auto }
  .plan-chev{ display:none }
  .ev-row .t{ white-space:normal; line-height:1.4 }
  .ev-row{ padding-block:4px }
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:1ms !important; animation-iteration-count:1 !important;
    transition-duration:1ms !important;
  }
  .scroll{ scroll-behavior:auto }
  @starting-style{ .turn{ opacity:1; translate:none } }
}

</style>

<body>
<div class="app" id="app" data-rail="open">
  <div class="scrim" id="scrim" hidden></div>

  <nav class="rail" id="rail" aria-label="Chat history">
    <div class="rail-inner">
      <div class="rail-top">
        <button class="new-chat" id="newChat">
          <i data-icon="plus"></i>
          New chat
        </button>
        <button class="icon rail-close" id="railClose" aria-label="Close history"><i data-icon="x"></i></button>
      </div>

      <div class="rail-search">
        <i data-icon="search"></i>
        <input id="search" type="text" placeholder="Search chats" aria-label="Search chats" autocomplete="off" spellcheck="false">
      </div>

      <div class="history" id="history"></div>

      <div class="rail-foot">
        <button class="me-btn" id="accountBtn" aria-haspopup="menu" aria-expanded="false">
          <span class="avatar avatar-me" aria-hidden="true">A</span>
          <span class="me-meta">
            <span class="me-name">Ade</span>
            <span class="me-mode" id="modeLabel">Local events</span>
          </span>
        </button>
        <button class="icon" id="settingsBtn" aria-label="Settings" aria-haspopup="menu" aria-expanded="false">
          <i data-icon="settings"></i>
        </button>
      </div>
    </div>
  </nav>

  <main class="panel">
    <header class="top">
      <button class="icon" id="toggle" aria-label="Toggle history"><i data-icon="panel-left"></i></button>
      <h1 class="top-title" id="title"></h1>
      <span class="top-spacer"></span>
      <button class="icon" id="chatMenuBtn" aria-label="Chat options" aria-haspopup="menu" aria-expanded="false">
        <i data-icon="ellipsis-vertical"></i>
      </button>
    </header>

    <div class="scroll" id="scroll" role="log" aria-live="polite" aria-label="Conversation">
      <div class="thread" id="thread"></div>
      <div class="blank" id="blank">
        <div class="blank-inner">
          <h1>What are we<br>building today?</h1>
          <p>Ask for work and the run explains itself as it happens. Ask a question and it just answers.</p>
          <div class="prompts" id="prompts">
            <button class="prompt" type="button" data-say="Build a premium B2B SaaS landing page using Apple's design language."><i data-icon="sparkles"></i>Build a landing page</button>
            <button class="prompt" type="button" data-say="Fix the failing authentication tests."><i data-icon="flask-conical"></i>Fix failing tests</button>
            <button class="prompt" type="button" data-say="Run the release pipeline and commit the result."><i data-icon="git-branch"></i>Run the release pipeline</button>
            <button class="prompt" type="button" data-say="Fix authentication, redesign the dashboard, run the full suite, then commit."><i data-icon="list-checks"></i>Ship three tasks</button>
          </div>
        </div>
      </div>
    </div>

    <div class="dock">
      <div class="dock-inner">
        <form class="field" id="form">
          <textarea id="input" rows="1" placeholder="Message" aria-label="Message"></textarea>
          <button class="send" id="send" type="submit" data-idle="1" aria-label="Send">
            <i class="arrow" data-icon="arrow-up"></i>
            <i class="stop" data-icon="square"></i>
          </button>
        </form>
        <p class="note" id="note">Scripted events. The orchestrator is not wired to this surface yet.</p>
      </div>
    </div>
  </main>
</div>

<div class="menu-layer" id="menuLayer" hidden></div>

    if (d.conflicts) rows.push(["Conflicts", d.conflicts]);
    if (d.result) rows.push(["Result", d.result]);
    frag.appendChild(evFacts(rows));
    (d.diffs || []).forEach((f) => {
      frag.appendChild(evRow({ icon: "file-diff", text: f.path, meta: f.op, build: () => evDiff(f.diff) }));
    });
    return frag;
  },
  rollback(d) {
    return evFacts([
      ["State", d.state],
      ["Introduced by", d.task],
      ["Reversed", d.reversed, true],
      ["Files restored", (d.files || []).join(", ")],
      ["Verified", d.verified ? "Yes, tests re-run" : "Not verified"],
      ...(d.limitation ? [["Limit", d.limitation]] : [])
    ].filter((r) => r[1]));
  },
  notes(d) { return evFacts((d.rows || []).map((r) => r)); }
};

/* plan rows ----------------------------------------------------------- */

function planNode(run, plan, entry) {
  const wrap = el("div", "plan-row");
  wrap.dataset.key = plan.key;
  if (!plan.open) wrap.classList.add("closed");

  const head = el("button", "plan-head");
  head.type = "button";
  head.setAttribute("aria-expanded", plan.open ? "true" : "false");

  const badge = el("span", "plan-badge");
  const step = el("span", null, plan.step == null ? "" : String(plan.step));
  badge.appendChild(step);
  head.appendChild(badge);
  head.appendChild(el("span", "plan-label", plan.label));
  head.appendChild(el("span", "plan-meta", plan.meta));
  const pills = el("span", "plan-pills");
  head.appendChild(pills);
  const chev = el("span", "plan-chev");
  chev.appendChild(iconEl("chevron-down"));
  head.appendChild(chev);

  const detail = el("div", "plan-detail");
  const dbody = el("div", "plan-dbody");
  detail.appendChild(dbody);
  wrap.append(head, detail);

  const node = { wrap, head, badge, pills, dbody, plan, rendered: null, badgeSig: null,
    label: wrap.querySelector(".plan-label"), meta: wrap.querySelector(".plan-meta") };

  head.addEventListener("click", () => {
    plan.open = !plan.open;
    wrap.classList.toggle("closed", !plan.open);
    head.setAttribute("aria-expanded", plan.open ? "true" : "false");
    if (plan.open) fillDetail(node);
    save();
  });

  entry.planNodes[plan.key] = node;
  paintPlan(node, run);
  if (plan.open) fillDetail(node);
  return node;
}

function paintPlan(node, run) {
  const p = node.plan;
  node.badge.className = "plan-badge " + (p.status || "pending");
  node.badge.style.setProperty("--p", String(p.progress || 0));
  const sig = (p.status || "pending") + "|" + p.step;
  if (node.badgeSig !== sig) {
    node.badgeSig = sig;
    const ic = statusIcon(p.status);
    node.badge.replaceChildren();
    node.badge.appendChild(ic ? iconEl(ic) : el("span", null, p.step == null ? "" : String(p.step)));
  }
  node.label.textContent = p.label;
  node.meta.textContent = p.meta || "";

  const want = p.status === "done" ? "done" : p.status === "failed" ? "failed" : p.status === "running" ? "running"
    : p.status === "blocked" ? "blocked" : p.status === "skipped" ? "skipped" : null;
  const current = node.pills.dataset.state || "";
  if (want !== current) {
    node.pills.dataset.state = want || "";
    node.pills.replaceChildren();
    if (want === "done") node.pills.appendChild(el("span", "plan-pill done", "Completed"));
    if (want === "failed") {
      node.pills.appendChild(el("span", "plan-pill failed", "Failed"));
      const retry = el("button", "plan-retry");
      retry.type = "button";
      retry.setAttribute("aria-label", "Retry " + p.label);
      retry.appendChild(iconEl("rotate-ccw"));
      retry.addEventListener("click", (e) => { e.stopPropagation(); retryPlan(node, run); });
      node.pills.appendChild(retry);
    }
    if (want === "running") node.pills.appendChild(el("span", "plan-pill running", "Running"));
    if (want === "blocked") node.pills.appendChild(el("span", "plan-pill idle", "Blocked"));
    if (want === "skipped") node.pills.appendChild(el("span", "plan-pill idle", "Skipped"));
  }
  const detailSig = JSON.stringify([p.details, p.evidence]);
  if (node.rendered !== detailSig && !node.wrap.classList.contains("closed")) fillDetail(node);
}

function fillDetail(node) {
  const p = node.plan;
  const sig = JSON.stringify([p.details, p.evidence]);
  if (node.rendered === sig) return;
  morphHeight(node.dbody, () => {
    const frag = document.createDocumentFragment();
    (p.details || []).forEach((d) => {
      const line = el("div", "plan-dline");
      line.appendChild(el("span", null, d[0]));
      const machine = d[2] === true || (/[/\\]|\.(js|ts|tsx|css|html|json|md)\b|\d/.test(d[1]) && d[1].length < 42);
      line.appendChild(el("span", machine ? "mono" : null, d[1]));
      frag.appendChild(line);
    });
    if (p.evidence) {
      const build = EVIDENCE[p.evidence.kind] || EVIDENCE.facts;
      const box = el("div", "ev");
      box.appendChild(build(p.evidence));
      frag.appendChild(box);
    }
    node.dbody.replaceChildren(frag);
  });
  node.rendered = sig;
}

/* turn shell ---------------------------------------------------------- */

function buildTurn(entry) {
  if (!entry.run) return null;
  const run = entry.run;
  const wrap = el("article", "turn bot");

  const trace = el("div", "agent-trace" + (run.open ? "" : " closed") + (run.working ? " working" : ""));
  const head = el("button", "trace-head" + (run.working ? " working" : ""));
  head.type = "button";
  head.setAttribute("aria-expanded", run.open ? "true" : "false");

  const glyph = el("span", "trace-glyph");
  const spark = iconEl("sparkles");
  spark.classList.add("spark");
  glyph.appendChild(spark);
  glyph.appendChild(pixelGrid());

  const status = el("span", "trace-status", run.status);
  const time = el("span", "trace-time", run.elapsed || "");
  const chev = el("span", "trace-chev");
  chev.appendChild(iconEl("chevron-down"));
  head.append(glyph, status, time, chev);

  const body = el("div", "trace-body");
  const clip = el("div", "trace-clip");
  const viewport = el("div", "trace-scroll");
  const list = el("div", "trace-list");
  const rail = el("span", "trace-rail");
  list.appendChild(rail);
  viewport.appendChild(list);
  clip.appendChild(viewport);
  body.appendChild(clip);
  trace.append(head, body);

  const plans = el("div", "plan-rows");
  const msg = el("div", "msg-body");

  wrap.append(trace, plans, msg);

  entry.node = wrap;
  entry.planNodes = {};
  entry.rowCount = 0;

  head.addEventListener("click", () => {
    if (run.working && run.runState === "running") return; // an active run stays open
    run.open = !run.open;
    entry.traceTouched = true;
    trace.classList.toggle("closed", !run.open);
    head.setAttribute("aria-expanded", run.open ? "true" : "false");
    save();
  });

  entry.trace = { root: trace, head, status, time, list, rail, viewport };
  entry.plansHost = plans;
  entry.msg = msg;

  syncRows(entry);
  syncPlans(entry);
  if (run.answer) { paintAnswer(entry, run.answer); finishActions(entry); }
  return wrap;
}

function syncRows(entry) {
  const run = entry.run;
  if (!entry.trace) return;
  const { list, rail } = entry.trace;
  const moreEl = list.querySelector(".trace-more");
  for (let i = entry.rowCount; i < run.rows.length; i++) {
    const node = traceRowNode(run.rows[i], i);
    if (moreEl) list.insertBefore(node, moreEl);
    else list.appendChild(node);
  }
  entry.rowCount = Math.min(entry.rowCount, run.rows.length);
  if (run.rows.length > entry.rowCount) entry.rowCount = run.rows.length;

  if (run.more && !moreEl) {
    const more = el("div", "trace-more", "+" + run.more + " more");
    more.style.setProperty("--d", run.rows.length * 60 + "ms");
    list.appendChild(more);
  }

  const rows = list.querySelectorAll(".trace-row");
  rows.forEach((node, i) => {
    node.classList.toggle("live", !!run.rows[i] && run.rows[i].live === true && run.working);
  });

  requestAnimationFrame(() => syncStream(entry));
}

const STREAM_MAX = 208;

function syncStream(entry) {
  const t = entry.trace;
  if (!t || !t.viewport) return;
  const h = t.list.scrollHeight;
  const working = entry.run.working && entry.run.runState === "running";
  const height = Math.min(h, STREAM_MAX);
  t.viewport.style.height = height + "px";
  t.list.style.transform = working ? `translateY(${Math.min(0, height - h)}px)` : "translateY(0)";
  const capped = h > STREAM_MAX;
  t.viewport.classList.toggle("fade-top", capped && working);
  t.viewport.classList.toggle("fade-both", capped && !working);
  t.rail.style.height = Math.max(0, h - 20) + "px";
}

function syncPlans(entry) {
  const run = entry.run;
  run.plans.forEach((plan) => {
    const existing = entry.planNodes[plan.key];
    if (!existing) {
      const node = planNode(run, plan, entry);
      node.wrap.style.setProperty("--d", entry.plansHost.children.length * 60 + "ms");
      entry.plansHost.appendChild(node.wrap);
    } else {
      paintPlan(existing, run);
    }
  });
}

function syncHead(entry) {
  const run = entry.run;
  if (!entry.trace) return;
  const working = run.working && run.runState === "running";
  const thinking = working && run.rows.length === 0;
  entry.trace.root.classList.toggle("working", working);
  entry.trace.root.classList.toggle("thinking", thinking);
  entry.trace.head.classList.toggle("working", working);
  entry.trace.status.textContent = run.working ? run.status : (run.done || run.status);
  entry.trace.time.textContent = run.elapsed || "";
  if (!working) {
    entry.trace.list.querySelectorAll(".trace-ring").forEach((ring) => {
      const ico = el("span", "trace-ico");
      ico.appendChild(iconEl("check"));
      ring.replaceWith(ico);
    });
  }
}

function parseAnswer(text) {
  const blocks = [];
  String(text).split("\n").forEach((line) => {
    if (/^-\s+/.test(line)) blocks.push({ type: "li", text: line.replace(/^-\s+/, "") });
    else if (line.trim()) blocks.push({ type: "p", text: line.trim() });
  });
  return blocks;
}

function paintAnswer(entry, text) {
  entry.msg.replaceChildren();
  let ul = null;
  String(text).split("\n").forEach((line) => {
    if (/^-\s+/.test(line)) {
      if (!ul) { ul = el("ul"); entry.msg.appendChild(ul); }
      const li = el("li");
      li.innerHTML = inline(line.replace(/^-\s+/, ""));
      ul.appendChild(li);
    } else if (line.trim()) {
      ul = null;
      const p = el("p");
      p.innerHTML = inline(line.trim());
      entry.msg.appendChild(p);
    }
  });
}

function cancelStream(entry) {
  if (entry.stream) { clearInterval(entry.stream); entry.stream = null; }
  const caret = entry.msg && entry.msg.querySelector(".stream-caret");
  if (caret) caret.remove();
}

/* Character reveal with a soft blurred leading edge, ported from the
   StreamText primitive: 2 chars per 9ms, last 6 behind a mask. */
function streamAnswer(entry, text) {
  cancelStream(entry);
  const blocks = parseAnswer(text);
  entry.msg.replaceChildren();
  entry.msg.classList.remove("fade");
  let ul = null;
  const items = blocks.map((b) => {
    let node;
    if (b.type === "li") {
      if (!ul) { ul = el("ul"); entry.msg.appendChild(ul); }
      node = el("li");
      ul.appendChild(node);
    } else {
      ul = null;
      node = el("p");
      entry.msg.appendChild(node);
    }
    return { node, text: b.text, done: false };
  });
  if (!items.length) return;

  const caret = el("span", "stream-caret is-streaming");
  caret.setAttribute("aria-hidden", "true");
  const total = items.reduce((n, item) => n + item.text.length, 0);
  let shown = 0;

  const paint = () => {
    let acc = 0;
    let edge = null;
    items.forEach((item) => {
      const visible = Math.max(0, Math.min(item.text.length, shown - acc));
      acc += item.text.length;
      if (visible >= item.text.length) {
        if (!item.done) { item.node.textContent = item.text; item.node.hidden = false; item.done = true; }
        return;
      }
      item.done = false;
      if (visible === 0) { item.node.textContent = ""; item.node.hidden = true; return; }
      item.node.hidden = false;
      if (!edge) edge = { item, visible };
    });
    if (edge) {
      const head = edge.item.text.slice(0, edge.visible);
      const split = Math.max(0, head.length - 6);
      edge.item.node.replaceChildren(document.createTextNode(head.slice(0, split)));
      edge.item.node.appendChild(el("span", "stream-tail", head.slice(split)));
      edge.item.node.appendChild(caret);
    }
    pinIfNearBottom();
  };

  paint();
  entry.stream = setInterval(() => {
    shown = Math.min(total, shown + 2);
    paint();
    if (shown >= total) {
      cancelStream(entry);
      paintAnswer(entry, text);
      finishActions(entry);
      save();
    }
  }, 9);
}

function setAnswer(entry, text, animate) {
  if (!entry.msg) return;
  cancelStream(entry);
  entry.streaming = false;
  const reduced = calm() || document.documentElement.dataset.motion === "off" || !state.settings.stream;
  if (animate && !reduced) { streamAnswer(entry, text); return; }
  paintAnswer(entry, text);
  if (animate) {
    entry.msg.classList.remove("fade");
    void entry.msg.offsetWidth;
    entry.msg.classList.add("fade");
  }
}

function inline(text) {
  return String(text)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
}

function actionsNode(entry) {
  const acts = el("div", "bot-acts");
  const copy = el("button", "act");
  copy.type = "button";
  copy.appendChild(iconEl("copy"));
  copy.appendChild(el("span", null, "Copy"));
  copy.addEventListener("click", () => copyText(transcript(entry), copy));
  acts.appendChild(copy);
  const again = el("button", "act");
  again.type = "button";
  again.appendChild(iconEl("refresh-cw"));
  again.appendChild(el("span", null, "Regenerate"));
  again.addEventListener("click", () => rerun(entry));
  acts.appendChild(again);
  return acts;
}

function transcript(entry) {
  const run = entry.run;
  if (!run) return entry.text || "";
  const lines = run.plans.map((p) => "- " + p.label + (p.meta ? " (" + p.meta + ")" : ""));
  if (run.answer) lines.push("", run.answer);
  return lines.join("\n");
}

function copyText(text, button) {
  const label = button && button.querySelector("span");
  if (!label) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(text); } catch (e) { /* no clipboard */ }
    return;
  }
  const done = () => {
    const before = label.textContent;
    label.textContent = "Copied";
    setTimeout(() => { label.textContent = before; }, 1400);
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(done).catch(() => { label.textContent = "Select to copy"; });
  } else label.textContent = "Select to copy";
}

function rerun(entry) {
  if (state.running) return;
  const c = active();
  const index = c.turns.indexOf(entry);
  const prompt = index > 0 ? c.turns[index - 1].text : "";
  const id = routeFor(prompt);
  c.turns.splice(index, 1);
  renderThread();
  if (id) send(prompt, id); else send(prompt);
}

function retryPlan(node, run) {
  const p = node.plan;
  p.status = "running";
  p.meta = "retrying";
  p.progress = 30;
  paintPlan(node, run);
  setTimeout(() => {
    p.status = "done";
    p.meta = "3 picks";
    p.progress = 100;
    paintPlan(node, run);
    save();
  }, 1400);
}

const SCENARIOS = { landing: LANDING, tests: TESTS_RUN, pipeline: PIPELINE, multi: MULTI };

function routeFor(text) {
  const t = String(text || "").toLowerCase();
  if (/\b(hi|hello|hey|yo|thanks|thank you)\b/.test(t) && t.length < 24) return null;
  if (/three|everything|ship|all of it/.test(t)) return "multi";
  if (/pipeline|release|deploy|ci\b/.test(t)) return "pipeline";
  if (/test|suite|failing|fails/.test(t)) return "tests";
  if (/land|page|site|design|interface/.test(t)) return "landing";
  return null;
}

/* ------------------------------------------------------------------ driver */

function startRun(entry, scenarioId, fromIndex = 0) {
  const steps = SCENARIOS[scenarioId];
  if (!steps) return;
  state.running = true;
  state.abort = false;
  setBusy(true);
  entry.run.t0 = Date.now();
  state.driver = { scenarioId, index: fromIndex, chatId: state.activeId, turnId: entry.id };
  save();
  tickStart(entry);
  drive(entry, steps, fromIndex);
}

function tickStart(entry) {
  stopTimer(entry);
  entry.timer = setInterval(() => {
    if (!entry.run || !entry.run.working) return;
    entry.run.elapsed = fmt((Date.now() - entry.run.t0) / 1000);
    if (entry.trace) entry.trace.time.textContent = entry.run.elapsed;
  }, 100);
}
function stopTimer(entry) {
  if (entry.timer) { clearInterval(entry.timer); entry.timer = null; }
}

async function drive(entry, steps, fromIndex) {
  for (let i = fromIndex; i < steps.length; i++) {
    if (state.abort || entry.stopped || !entry.node || !entry.node.isConnected) break;
    const step = steps[i];
    if (step.d > 0) await wait(calm() ? Math.min(step.d, 40) : step.d);
    if (state.abort || entry.stopped) break;

    applyEvent(entry.run, step.ev);
    if (state.driver) state.driver.index = i + 1;

    if (entry.node && entry.node.isConnected) {
      if (step.ev.t === "row" || step.ev.t === "more" || step.ev.t === "rowdone") syncRows(entry);
      if (step.ev.t === "plan" || step.ev.t === "planset") syncPlans(entry);
      if (step.ev.t === "answer") setAnswer(entry, entry.run.answer, true);
      if (step.ev.t === "settle") settle(entry);
      syncHead(entry);
      pinIfNearBottom();
    }

    if (step.ev.t === "settle" || step.ev.t === "answer") save();
    if (step.ev.t === "end") {
      state.running = false;
      state.driver = null;
      stopTimer(entry);
      setBusy(false);
      syncHead(entry);
      finishActions(entry);
      save();
      return;
    }
  }
  if (state.abort || entry.stopped) {
    state.abort = false;
    state.running = false;
    state.driver = null;
    stopTimer(entry);
    setBusy(false);
    save();
    return;
  }
  state.running = false;
  state.driver = null;
  stopTimer(entry);
  setBusy(false);
  save();
}

function settle(entry) {
  const run = entry.run;
  run.working = false;
  run.elapsed = fmt((Date.now() - run.t0) / 1000);
  const secs = Math.max(1, Math.round((Date.now() - run.t0) / 1000));
  run.done = run.done || ("Thought for " + secs + " seconds");
  stopTimer(entry);
  if (entry.trace) {
    syncHead(entry);
    entry.trace.head.classList.add("settled-flash");
    setTimeout(() => entry.trace.head.classList.remove("settled-flash"), 800);
    if (!entry.traceTouched) {
      run.open = false;
      entry.trace.root.classList.add("closed");
      entry.trace.head.setAttribute("aria-expanded", "false");
    }
  }
  entry.run.rows.forEach((r) => { r.live = false; });
  syncRows(entry);
}

function finishActions(entry) {
  if (!entry.node || entry.node.querySelector(".bot-acts")) return;
  entry.node.appendChild(actionsNode(entry));
}

function markStopped(entry) {
  if (entry.stopped) return;
  entry.stopped = true;
  entry.run.working = false;
  entry.run.runState = "cancelled";
  entry.run.done = "Stopped";
  entry.run.plans.forEach((p) => { if (p.status === "running") { p.status = "failed"; p.meta = "stopped"; } });
  settle(entry);
  syncPlans(entry);
  finishActions(entry);
}

/* ------------------------------------------------------------------ chat plumbing */

function threadNode(entry) {
  if (entry.role === "mine") {
    const wrap = el("article", "turn mine");
    wrap.appendChild(el("div", "mine-bubble", entry.text));
    const avatar = el("span", "avatar", "A");
    avatar.setAttribute("aria-label", "You");
    wrap.appendChild(avatar);
    entry.node = wrap;
    return wrap;
  }
  if (entry.mode === "text") {
    const wrap = el("article", "turn bot");
    const body = el("div", "msg-body");
    body.innerHTML = inline(entry.text || "").replace(/\. /g, ". ");
    wrap.appendChild(body);
    wrap.appendChild(actionsNode(entry));
    entry.node = wrap;
    return wrap;
  }
  return buildTurn(entry);
}

function renderThread() {
  const host = $("#thread");
  host.replaceChildren();
  const c = active();
  const empty = !c || !c.turns.length;
  $("#blank").style.display = empty ? "" : "none";
  host.style.display = empty ? "none" : "";
  $("#title").textContent = empty ? "" : c.title;
  const kebab = $("#chatMenuBtn");
  if (kebab) { kebab.hidden = empty; kebab.disabled = empty; }
  if (empty) return;
  c.turns.forEach((entry) => host.appendChild(threadNode(entry)));
  if (c.turns.some((t) => t.run && t.run.working)) {
    const running = [...c.turns].reverse().find((t) => t.run && t.run.working);
    if (running) tickStart(running);
  }
}

function matchesQuery(c, q) {
  if (!q) return true;
  const title = (c.title || "").toLowerCase();
  if (title.includes(q)) return true;
  return c.turns.some((t) => (t.text || (t.run && t.run.answer) || "").toLowerCase().includes(q));
}

function renderHistory() {
  const host = $("#history");
  host.replaceChildren();
  const q = state.query.trim().toLowerCase();
  let shown = 0;
  ["Today", "Previous 7 days"].forEach((group) => {
    const rows = state.chats
      .filter((c) => c.group === group && c.turns.length && matchesQuery(c, q))
      .sort((x, y) => (y.starred ? 1 : 0) - (x.starred ? 1 : 0));
    if (!rows.length) return;
    host.appendChild(el("div", "h-group", group));
    rows.forEach((row) => {
      const b = el("button", "conv");
      b.type = "button";
      b.setAttribute("aria-current", row.id === state.activeId ? "true" : "false");
      b.appendChild(el("span", "conv-text", row.title || "New chat"));
      if (row.starred) {
        const star = el("span", "conv-star");
        star.appendChild(iconEl("star"));
        b.appendChild(star);
      }
      b.addEventListener("click", () => openChat(row.id));
      b.addEventListener("contextmenu", (e) => { e.preventDefault(); openChat(row.id); chatMenu(b); });
      host.appendChild(b);
      shown++;
    });
  });
  if (!shown && q) host.appendChild(el("div", "empty-history", "No chats match"));
}

function openChat(id) {
  if (state.running) stop();
  closeMenu(false);
  state.activeId = id;
  renderHistory();
  renderThread();
  $("#scroll").scrollTop = 0;
  if (innerWidth <= 900) setRail(false);
}

const PLAIN = "Say what to build, fix, test or ship and I will run it, with the evidence folded away until you want it.";

function plainReply(text) {
  const t = String(text).trim().toLowerCase();
  if (/^(hi|hello|hey|yo)\b/.test(t)) return "Hello. What are you working on?";
  if (/thank/.test(t)) return "Any time. Want me to pick up the next piece?";
  return PLAIN;
}

function send(text, forced) {
  const message = String(text || "").trim();
  if (!message || state.running) return;
  const c = active();
  if (!c) return;

  if (!c.turns.length) c.title = message.length > 46 ? message.slice(0, 46).trim() + "\u2026" : message;
  c.turns.push({ role: "mine", text: message });

  const id = forced || routeFor(message);
  const entry = id
    ? { id: uid("run"), role: "bot", mode: "run", run: blankRun() }
    : { id: uid("say"), role: "bot", mode: "text", text: plainReply(message) };

  c.turns.push(entry);
  renderHistory();
  renderThread();
  pin();

  if (id) startRun(entry, id, 0);
  else save();
}

/* ------------------------------------------------------------------ chrome */

function pin() { const box = $("#scroll"); box.scrollTop = box.scrollHeight; }
function pinIfNearBottom() {
  const box = $("#scroll");
  if (box.scrollHeight - box.scrollTop - box.clientHeight < 160) box.scrollTop = box.scrollHeight;
}
function grow(input) {
  input.style.height = "auto";
  input.style.height = Math.min(input.scrollHeight, 152) + "px";
}
function setBusy(busy) {
  const b = $("#send");
  b.dataset.busy = busy ? "1" : "0";
  b.dataset.idle = busy ? "0" : ($("#input").value.trim() ? "0" : "1");
  b.setAttribute("aria-label", busy ? "Stop" : "Send");
  $("#note").textContent = busy ? "Running. Stop halts the run where it is." : "Scripted events. The orchestrator is not wired to this surface yet.";
  $("#modeLabel").textContent = busy ? "Running" : "Local events";
}
function stop() {
  state.abort = true;
  const c = active();
  const entry = c && [...c.turns].reverse().find((t) => t.run && t.run.runState === "running");
  if (entry) markStopped(entry);
  state.running = false;
  setBusy(false);
}
function setRail(open) {
  $("#app").dataset.rail = open ? "open" : "closed";
  $("#scrim").hidden = !open;
}
function wireDrawer() {
  const rail = $("#rail"), scrim = $("#scrim");
  const width = () => rail.getBoundingClientRect().width || 300;
  let dragging = false, grabX = 0, samples = [];
  rail.addEventListener("pointerdown", (e) => {
    if (innerWidth > 900 || $("#app").dataset.rail !== "open") return;
    if (e.target.closest("button, a, textarea")) return;
    dragging = true; grabX = e.clientX;
    samples = [{ x: e.clientX, t: performance.now() }];
    rail.setPointerCapture(e.pointerId);
    rail.style.transition = "none";
  });
  rail.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const dx = Math.min(0, e.clientX - grabX);
    apply(rail, "x", dx);
    samples.push({ x: e.clientX, t: performance.now() });
    if (samples.length > 6) samples.shift();
    scrim.style.opacity = String(0.42 * (1 - Math.min(1, Math.abs(dx) / width())));
  });
  const end = () => {
    if (!dragging) return;
    dragging = false;
    rail.style.transition = "";
    const first = samples[0], last = samples[samples.length - 1];
    const dt = Math.max(1, last.t - first.t) / 1000;
    const v = (last.x - first.x) / dt;
    const current = parseFloat(rail.dataset.x || "0");
    scrim.style.opacity = "";
    if (current + v * 0.15 < -width() * 0.42 || v < -420) {
      setRail(false);
      springTo(rail, "x", -width(), { response: 0.32 });
    } else {
      setRail(true);
      springTo(rail, "x", 0, { response: 0.32 });
    }
  };
  rail.addEventListener("pointerup", end);
  rail.addEventListener("pointercancel", end);
}
function newChat() {
  if (state.running) stop();
  closeMenu(false);
  const c = { id: uid("c"), group: "Today", title: "", turns: [] };
  state.chats.unshift(c);
  state.activeId = c.id;
  renderHistory();
  renderThread();
  save();
  if (innerWidth <= 900) { setRail(false); springTo($("#rail"), "x", -300, { response: 0.32 }); }
  $("#input").focus();
}


/* ------------------------------------------------------------------ menus */

let menuOpen = null;

function closeMenu(restoreFocus) {
  if (!menuOpen) return;
  const { layer, menu, anchor } = menuOpen;
  menuOpen = null;
  layer.hidden = true;
  layer.replaceChildren();
  if (anchor) {
    anchor.setAttribute("aria-expanded", "false");
    if (restoreFocus) anchor.focus({ preventScroll: true });
  }
  void menu;
}

function openMenu(anchor, build, opts = {}) {
  const layer = $("#menuLayer");
  const same = menuOpen && menuOpen.anchor === anchor;
  closeMenu(false);
  if (same) return null;

  const menu = el("div", "menu");
  menu.setAttribute("role", "menu");
  menu.setAttribute("aria-label", opts.label || "Menu");
  build(menu);
  layer.replaceChildren(menu);
  layer.hidden = false;

  const rect = anchor.getBoundingClientRect();
  const size = menu.getBoundingClientRect();
  const align = opts.align || "end";
  let left = align === "start" ? rect.left : rect.right - size.width;
  left = Math.min(Math.max(8, left), innerWidth - size.width - 8);
  let top = rect.bottom + 6;
  if (top + size.height > innerHeight - 8) top = Math.max(8, rect.top - size.height - 6);
  menu.style.insetInlineStart = left + "px";
  menu.style.insetBlockStart = top + "px";
  menu.style.transformOrigin = (align === "start" ? "left" : "right") + " top";

  anchor.setAttribute("aria-expanded", "true");
  menuOpen = { layer, menu, anchor };

  const items = () => Array.from(menu.querySelectorAll(".menu-item, .menu-row"));
  const first = items()[0];
  if (first) first.focus({ preventScroll: true });

  menu.addEventListener("keydown", (event) => {
    const all = items();
    if (!all.length) return;
    const at = all.indexOf(document.activeElement);
    if (event.key === "Escape") { event.preventDefault(); closeMenu(true); }
    else if (event.key === "ArrowDown") { event.preventDefault(); all[(at + 1) % all.length].focus(); }
    else if (event.key === "ArrowUp") { event.preventDefault(); all[(at - 1 + all.length) % all.length].focus(); }
    else if (event.key === "Tab") { closeMenu(false); }
  });
  return menu;
}

function menuItem(icon, label, onSelect, opts = {}) {
  const b = el("button", "menu-item" + (opts.danger ? " danger" : ""));
  b.type = "button";
  b.setAttribute("role", "menuitem");
  if (opts.disabled) b.disabled = true;
  if (icon) b.appendChild(iconEl(icon));
  b.appendChild(el("span", "menu-text", label));
  if (opts.checked) {
    const tick = iconEl("check");
    tick.classList.add("menu-tick");
    b.appendChild(tick);
  }
  b.addEventListener("click", () => { closeMenu(false); onSelect(); });
  return b;
}

function toggleRow(label, sub, value, onChange) {
  const row = el("button", "menu-row");
  row.type = "button";
  row.setAttribute("role", "menuitemcheckbox");
  row.setAttribute("aria-checked", value ? "true" : "false");
  const text = el("span", "menu-text", label);
  if (sub) text.appendChild(el("span", "menu-sub", sub));
  row.appendChild(text);
  const knob = el("span", "switch");
  knob.setAttribute("aria-checked", value ? "true" : "false");
  row.appendChild(knob);
  row.addEventListener("click", () => {
    const next = row.getAttribute("aria-checked") !== "true";
    row.setAttribute("aria-checked", next ? "true" : "false");
    knob.setAttribute("aria-checked", next ? "true" : "false");
    onChange(next);
  });
  return row;
}

function applyMotion() {
  document.documentElement.dataset.motion = state.settings.motion ? "on" : "off";
}

/* ------------------------------------------------------------------ chat chrome */

function transcriptOf(c) {
  const out = [];
  (c.turns || []).forEach((t) => {
    if (t.role === "mine") { out.push("You: " + t.text); return; }
    if (t.run) {
      t.run.plans.forEach((p) => out.push("- " + p.label + (p.meta ? " (" + p.meta + ")" : "") + " [" + p.status + "]"));
      if (t.run.answer) out.push("", t.run.answer);
      return;
    }
    if (t.text) out.push(t.text);
  });
  return out.join("\n").trim();
}

function exportChat(c) {
  const lines = ["# " + (c.title || "Chat"), "", "Exported from the agent response prototype.", ""];
  (c.turns || []).forEach((t) => {
    if (t.role === "mine") { lines.push("## You", "", t.text, ""); return; }
    if (t.run) {
      lines.push("## Run", "");
      t.run.plans.forEach((p) => lines.push("- " + p.label + " - " + p.status + (p.meta ? " - " + p.meta : "")));
      lines.push("");
      if (t.run.answer) lines.push(t.run.answer, "");
      return;
    }
    if (t.text) lines.push(t.text, "");
  });
  const body = lines.join("\n");
  try {
    const blob = new Blob([body], { type: "text/markdown;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const link = el("a");
    link.href = url;
    link.download = ((c.title || "chat").replace(/[^\w\s-]/g, "").trim().slice(0, 40) || "chat") + ".md";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  } catch (e) {
    try { if (navigator.clipboard) navigator.clipboard.writeText(body); } catch (err) { /* no clipboard */ }
  }
}

function deleteChat(id) {
  if (state.running) stop();
  const at = state.chats.findIndex((c) => c.id === id);
  if (at < 0) return;
  state.chats.splice(at, 1);
  if (!state.chats.length) state.chats.push({ id: uid("c"), group: "Today", title: "", turns: [] });
  if (state.activeId === id) state.activeId = state.chats[Math.min(at, state.chats.length - 1)].id;
  renderHistory();
  renderThread();
  save();
}

function clearAll() {
  if (state.running) stop();
  state.chats = [{ id: uid("c"), group: "Today", title: "", turns: [] }];
  state.activeId = state.chats[0].id;
  state.query = "";
  const search = $("#search");
  if (search) search.value = "";
  renderHistory();
  renderThread();
  save();
}

function chatMenu(anchor) {
  const c = active();
  if (!c) return;
  openMenu(anchor, (menu) => {
    const field = el("div", "menu-field");
    const input = el("input");
    input.type = "text";
    input.value = c.title || "";
    input.placeholder = "Chat name";
    input.setAttribute("aria-label", "Chat name");
    const commitRename = () => {
      const next = input.value.trim();
      c.title = next || "New chat";
      closeMenu(false);
      renderHistory();
      $("#title").textContent = c.turns.length ? c.title : "";
      save();
    };
    const saveBtn = el("button", null, "Save");
    saveBtn.type = "button";
    saveBtn.addEventListener("click", commitRename);
    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter") { event.preventDefault(); commitRename(); }
    });
    field.append(input, saveBtn);
    menu.appendChild(field);
    menu.appendChild(el("div", "menu-sep"));
    menu.appendChild(menuItem("star", c.starred ? "Unstar chat" : "Star chat", () => {
      c.starred = !c.starred;
      renderHistory();
      save();
    }, { checked: !!c.starred }));
    menu.appendChild(menuItem("copy", "Copy transcript", () => copyText(transcriptOf(c), null)));
    menu.appendChild(menuItem("download", "Export as markdown", () => exportChat(c)));
    menu.appendChild(el("div", "menu-sep"));
    menu.appendChild(menuItem("trash-2", "Delete chat", () => deleteChat(c.id), { danger: true }));
  }, { label: "Chat options" });
}

function settingsMenu(anchor) {
  openMenu(anchor, (menu) => {
    menu.appendChild(el("div", "menu-label", "Settings"));
    menu.appendChild(toggleRow("Stream replies", "Reveal the answer as it arrives", state.settings.stream, (v) => {
      state.settings.stream = v;
      save();
    }));
    menu.appendChild(toggleRow("Show activity details", "Open every task row by default", state.settings.expand, (v) => {
      state.settings.expand = v;
      save();
    }));
    menu.appendChild(toggleRow("Animations", "Motion across the interface", state.settings.motion, (v) => {
      state.settings.motion = v;
      applyMotion();
      save();
    }));
    menu.appendChild(el("div", "menu-sep"));
    menu.appendChild(menuItem("trash-2", "Clear all chats", clearAll, { danger: true }));
  }, { label: "Settings" });
}

function accountMenu(anchor) {
  openMenu(anchor, (menu) => {
    menu.appendChild(el("div", "menu-label", "Ade, signed in locally"));
    menu.appendChild(menuItem("plus", "New chat", newChat));
    menu.appendChild(menuItem("search", "Search chats", () => {
      const search = $("#search");
      if (search) search.focus();
    }));
    menu.appendChild(menuItem("settings", "Settings", () => settingsMenu(anchor)));
    menu.appendChild(el("div", "menu-sep"));
    menu.appendChild(menuItem("trash-2", "Clear all chats", clearAll, { danger: true }));
  }, { label: "Account", align: "start" });
}

function boot() {
  hydrateIcons();
  store.init();
  const input = $("#input"), form = $("#form"), sendBtn = $("#send");

  if (!load()) {
    const seed = { id: uid("c"), group: "Today", title: "", turns: [] };
    state.chats = [seed];
    state.activeId = seed.id;
  }

  applyMotion();

  const search = $("#search");
  search.addEventListener("input", () => {
    state.query = search.value;
    renderHistory();
  });
  search.addEventListener("keydown", (e) => {
    if (e.key === "Escape") { search.value = ""; state.query = ""; renderHistory(); search.blur(); }
  });

  $("#chatMenuBtn").addEventListener("click", (e) => chatMenu(e.currentTarget));
  $("#settingsBtn").addEventListener("click", (e) => settingsMenu(e.currentTarget));
  $("#accountBtn").addEventListener("click", (e) => accountMenu(e.currentTarget));
  $("#menuLayer").addEventListener("click", (e) => { if (e.target.id === "menuLayer") closeMenu(false); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeMenu(true); });
  addEventListener("pagehide", save);
  document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

  input.addEventListener("input", () => {
    grow(input);
    if (!state.running) sendBtn.dataset.idle = input.value.trim() ? "0" : "1";
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("focus", () => { form.dataset.focused = "1"; });
  input.addEventListener("blur", () => { delete form.dataset.focused; });

  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (state.running) { stop(); return; }
    const value = input.value;
    if (!value.trim()) return;
    input.value = "";
    grow(input);
    sendBtn.dataset.idle = "1";
    send(value);
  });

  $("#prompts").addEventListener("click", (e) => {
    const pill = e.target.closest("[data-say]");
    if (!pill || state.running) return;
    send(pill.dataset.say);
  });

  $("#newChat").addEventListener("click", newChat);
  $("#railClose").addEventListener("click", () => {
    setRail(false);
    if (innerWidth <= 900) springTo($("#rail"), "x", -$("#rail").getBoundingClientRect().width, { response: 0.32 });
  });
  $("#scrim").addEventListener("click", () => {
    setRail(false);
    if (innerWidth <= 900) springTo($("#rail"), "x", -$("#rail").getBoundingClientRect().width, { response: 0.32 });
  });
  $("#toggle").addEventListener("click", () => {
    const open = $("#app").dataset.rail === "open";
    if (innerWidth <= 900) {
      setRail(!open);
      springTo($("#rail"), "x", open ? -$("#rail").getBoundingClientRect().width : 0, { response: 0.34 });
      return;
    }
    setRail(!open);
  });

  if (innerWidth <= 900) { setRail(false); apply($("#rail"), "x", -300); }
  wireDrawer();
  renderHistory();
  renderThread();

  $("#scroll").scrollTop = 0;
  if (state.driver) {
    const c = chat(state.driver.chatId);
    const entry = c && c.turns.find((t) => t.id === state.driver.turnId);
    if (entry && entry.run && entry.run.runState === "running") startRun(entry, state.driver.scenarioId, state.driver.index);
    else state.driver = null;
  }
  input.focus();
}

window.__agent = {
  play(name) {
    const id = SCENARIOS[name] ? name : routeFor(name);
    if (!id) return false;
    send("Run the " + id + " scenario.", id);
    return true;
  },
  state() {
    const c = active();
    const last = c && c.turns[c.turns.length - 1];
    return { running: state.running, chats: state.chats.length, turns: c ? c.turns.length : 0,
      mode: last ? last.mode : null, run: last && last.run ? last.run : null };
  },
  stop,
  reset() { localStorage.removeItem(STORE_KEY); location.reload(); }
};

document.addEventListener("DOMContentLoaded", boot);

/* Offline shell. Registered only on a secure origin, so a plain file open
   never sees a worker it cannot control. */
if ("serviceWorker" in navigator && location.protocol === "https:") {
  addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(() => {});
  });
}

</script>
