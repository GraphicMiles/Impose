# Render Blueprint: the file Render looks for at the repository ROOT.
# Deploys the chat UI as a static site plus the optional relay (backend/relay/).
services:
  - type: web
    name: impose-web
    env: static
    # Ship the service worker, manifest, icons, and the legacy _headers mirror.
    # Render's actual response headers are declared below. Keep this file list
    # in sync with new root assets.
    buildCommand: mkdir -p dist/agent && cp index.html styles.css app.js lucide.min.js anime.min.js og-image.jpg manifest.json sw.js _headers dist/ && cp icon-*.png dist/ && cp agent/*.js agent/*.css dist/agent/
    staticPublishPath: ./dist
    # Render ignores Netlify-style _headers files. Declare production headers
    # in the Blueprint so they are actually present on the deployed site.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-jK07h4AyclQXrogD0NbnWLIjoXOg5ND8AaLOucyiTw8=' 'sha256-Fj0RQn2PeQP+pQvRPrc9chapGMwZdZ9O+cZ2Ge/SnHQ=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: http: localhost http://127.0.0.1 ws: wss:; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
  - type: web
    name: impose-relay
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r relay/requirements.txt
    startCommand: uvicorn relay.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONTROL_KEY
        generateValue: true          # random secret, shown once in the dashboard
      - key: ALLOWED_ORIGINS
        # Locked to the site origin. "*" let any page on the internet send
        # your relay key's requests from anyone's browser. Add your own
        # domains here (comma separated) if you host the UI elsewhere.
        value: "https://impose-web.onrender.com"
      # Search, images, and page reading run without a GPU gateway. Model
      # wake is opt-in: add the LLM_GATEWAY_* and LIGHTNING_* values in the
      # Render dashboard before changing these flags.
      - key: WAKE_STUDIO
        value: "0"
      - key: WAKE_ON_CHAT
        value: "0"
      - key: IDLE_MONITOR
        value: "0"
      - key: IDLE_STOP_MINUTES
        value: "5"
      - key: IDLE_CHECK_MINUTES
        value: "5"
