# Render Blueprint: the file Render looks for at the repository ROOT.
# Deploys the chat UI as a static site plus the optional relay (backend/relay/).
services:
  - type: web
    name: impose-web
    env: static
    # Ship the service worker, manifest, icons, and the legacy _headers mirror.
    # Render's actual response headers are declared below. Keep this file list
    # in sync with new root assets.
    buildCommand: mkdir -p dist/agent && cp index.html styles.css fonts.css app.js community.css community.js community-data.js config.js avatars.js ui-core.js access.js debug-bus.js auth.html auth.css auth.js auth-client.js supabase.min.js about.html privacy.html terms.html data-security.html contact.html acceptable-use.html 404.html public.css public.js lucide.min.js anime.min.js og-image.jpg manifest.json sw.js _headers impose-standalone.html dist/ && cp icon-*.png dist/ && cp agent/*.js agent/*.css dist/agent/
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /sign-in
        destination: /auth.html
      - type: rewrite
        source: /sign-up
        destination: /auth.html
      - type: rewrite
        source: /forgot-password
        destination: /auth.html
      - type: rewrite
        source: /otp
        destination: /auth.html
      - type: rewrite
        source: /reset-password
        destination: /auth.html
      - type: rewrite
        source: /about
        destination: /about.html
      - type: rewrite
        source: /privacy
        destination: /privacy.html
      - type: rewrite
        source: /terms
        destination: /terms.html
      - type: rewrite
        source: /data-security
        destination: /data-security.html
      - type: rewrite
        source: /contact
        destination: /contact.html
      - type: rewrite
        source: /acceptable-use
        destination: /acceptable-use.html
      # Anything else lands on the branded 404, which explains what happened
      # and offers a route back. Keep this rule LAST: Render matches in order.
      - type: rewrite
        source: /*
        destination: /404.html
    # Render ignores Netlify-style _headers files. Declare production headers
    # in the Blueprint so they are actually present on the deployed site.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'sha256-jK07h4AyclQXrogD0NbnWLIjoXOg5ND8AaLOucyiTw8=' 'sha256-Fj0RQn2PeQP+pQvRPrc9chapGMwZdZ9O+cZ2Ge/SnHQ=' https://static.cloudflareinsights.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self'; connect-src 'self' https: http: localhost http://127.0.0.1 ws: wss:; frame-src https://www.youtube-nocookie.com https://player.twitch.tv https://clips.twitch.tv; object-src 'none'; base-uri 'self'; form-action 'self'"
      - path: /*
        name: X-Content-Type-Options
        value: nosniff

      # Caching. Every asset revalidated on every load because nothing set
      # this, so a returning visitor paid a round trip per file to be told
      # nothing had changed.
      #
      # HTML is never cached: it is the document that names which script
      # versions to load, and a stale copy pins a browser to an old build
      # for as long as the cache lives. The service worker already handles
      # offline; this only stops needless revalidation.
      - path: /*.html
        name: Cache-Control
        value: "no-cache"
      - path: /
        name: Cache-Control
        value: "no-cache"
      # sw.js must never be cached either, or a new worker cannot install
      # and the version bump that ships a fix never reaches anyone.
      - path: /sw.js
        name: Cache-Control
        value: "no-cache"
      # Code and styles are revalidated rather than trusted blindly: the
      # filenames are not content-hashed, so a long max-age would serve a
      # stale app.js after a deploy. must-revalidate with a short window
      # keeps the conditional request cheap and the answer current.
      - path: /*.js
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      - path: /*.css
        name: Cache-Control
        value: "public, max-age=0, must-revalidate"
      # Immutable by nature: these change name when they change content, or
      # never change at all.
      - path: /*.png
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /*.jpg
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /fonts.css
        name: Cache-Control
        value: "public, max-age=604800"
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: "camera=(), microphone=(self), geolocation=()"
  - type: web
    name: impose-relay
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r relay/requirements.txt
    startCommand: uvicorn relay.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONTROL_KEY
        generateValue: true          # random secret, shown once in the dashboard
      # Peppers the one-time code hashes. Generated so it is never a default
      # anyone can look up, and so the stored hashes are useless off-box.
      - key: OTP_PEPPER
        generateValue: true
      # Sign-up and password-reset emails. Set these in the dashboard: with
      # no key the relay logs codes instead of sending them, which is the
      # right local default and the wrong production one.
      # The relay creates accounts, so it needs Supabase. The service key
      # bypasses RLS and is the only thing that can mint a user once public
      # signup is off, which is what makes verification mean anything.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SENDLIB_API_KEY
        sync: false
      - key: SENDLIB_FROM
        sync: false
      # Sent as the Origin header. Sendlib matches it against the key's
      # allowlist and refuses anything it reads as 'unknown'.
      - key: SENDLIB_ORIGIN
        value: https://impose-relay.onrender.com
      - key: ALLOWED_ORIGINS
        # Locked to the site origin. "*" let any page on the internet send
        # your relay key's requests from anyone's browser. Add your own
        # domains here (comma separated) if you host the UI elsewhere.
        value: "https://impose-web.onrender.com"
      # Search, images, and page reading run without a GPU gateway. Model
      # wake is opt-in: add the LLM_GATEWAY_* and LIGHTNING_* values in the
      # Render dashboard before changing these flags.
      - key: WAKE_STUDIO
        value: "0"
      - key: WAKE_ON_CHAT
        value: "0"
      - key: IDLE_MONITOR
        value: "0"
      - key: IDLE_STOP_MINUTES
        value: "5"
      - key: IDLE_CHECK_MINUTES
        value: "5"
