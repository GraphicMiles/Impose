# Render Blueprint: the file Render looks for at the repository ROOT.
# Deploys the chat UI as a static site plus the optional relay (backend/relay/).
services:
  - type: web
    name: impose-web
    env: static
    # sw.js, the manifest, the icons and _headers ship too: without them the
    # service worker never registers, the app is not installable, and the
    # CSP never applies. Keep this list in sync with new root files.
    buildCommand: mkdir -p dist/agent && cp index.html styles.css app.js lucide.min.js anime.min.js og-image.jpg manifest.json sw.js _headers dist/ && cp icon-*.png dist/ && cp agent/*.js agent/*.css dist/agent/
    staticPublishPath: ./dist
  - type: web
    name: impose-relay
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt -r relay/requirements.txt
    startCommand: uvicorn relay.server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CONTROL_KEY
        generateValue: true          # random secret, shown once in the dashboard
      - key: LLM_GATEWAY_URL
        sync: false                  # box gateway root, no /v1
      - key: LLM_GATEWAY_KEY
        sync: false                  # the box CONTROL_KEY
      - key: ALLOWED_ORIGINS
        # Locked to the site origin. "*" let any page on the internet send
        # your relay key's requests from anyone's browser. Add your own
        # domains here (comma separated) if you host the UI elsewhere.
        value: "https://impose-web.onrender.com"
      - key: WAKE_STUDIO
        value: "0"                   # set "1" to let the relay start/stop the Studio
      - key: WAKE_ON_CHAT
        value: "1"                   # wake the model when a request finds it down
      - key: IDLE_MONITOR
        value: "1"                   # stop the GPU Studio after idle (saves credits)
      - key: IDLE_STOP_MINUTES
        value: "5"
      - key: IDLE_CHECK_MINUTES
        value: "5"
      - key: LIGHTNING_API_KEY
        sync: false
      - key: LIGHTNING_USER_ID
        sync: false
      - key: LIGHTNING_USERNAME
        sync: false
      - key: LIGHTNING_STUDIO
        sync: false
      - key: LIGHTNING_TEAMSPACE
        sync: false
      - key: LIGHTNING_MACHINE
        value: T4
