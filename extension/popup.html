<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { -webkit-tap-highlight-color: rgba(0,0,0,0); }
  body { width: 240px; margin: 0; padding: 14px; font: 13px/1.5 system-ui, sans-serif; background: #171717; color: #ececec; }
  h1 { margin: 0 0 6px; font-size: 14px; }
  p { margin: 0 0 12px; color: #b6b6b6; }
  button { width: 100%; padding: 8px; border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; background: #2f2f2f; color: #ececec; cursor: pointer; font: inherit; }
  button:hover { background: #3a3a3a; }
  button:focus, button:focus-visible { outline: none; }
  button:focus-visible { box-shadow: none; }
</style>
</head>
<body>
  <h1>Impose Agent Bridge</h1>
  <p id="st">Starting…</p>
  <button id="open" type="button">Open Impose</button>
  <script src="popup.js"></script>
</body>
</html>
