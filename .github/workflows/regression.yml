name: regression gate

# Every scenario class the 2026-09-15 audit found is cheap to lose again: a
# stale single-file build, a red agent suite, or a relay contract break. This
# workflow is the mechanical check that replaces "remember to run them".

on:
  push:
  pull_request:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install relay dependencies
        # pytest is a test-only dependency and deliberately not in the
        # runtime requirements, which are what ships to the relay host.
        # It was missing here entirely, so the relay step failed with "No
        # module named pytest" on every run and the two steps after it
        # never executed.
        run: |
          python -m pip install -r backend/requirements.txt -r backend/relay/requirements.txt
          python -m pip install pytest
      - name: Static build is current
        run: python3 build_inline.py --check
      - name: Agent suites
        run: |
          node agent/tests/run.js
          node agent/tests/features.js
          node agent/tests/lifecycle.js
          node agent/tests/orchestrator.js
          node agent/tests/audit-regressions.js
          node agent/tests/taste.js
      - name: Workspace sync round trip
        # The per-account persistence layer seals provider keys before they
        # touch storage; this stubs localStorage and a session and asserts
        # no plaintext key ever reaches the cache, across both key tiers.
        run: node tests/workspace_sync_roundtrip.js
      - name: Relay contract suites
        run: PYTHONPATH=backend python3 -m pytest backend -q
      - name: Database schema assertions
        # RLS is the authorization layer, so a policy that silently denies
        # or silently permits is a security bug that review does not catch.
        # One of these caught a name-capture where p.id = remix_of resolved
        # to p.id = p.remix_of and refused every legitimate remix.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql
          sudo systemctl stop postgresql || true
          chmod +x supabase/tests/run.sh
          ./supabase/tests/run.sh
      - name: Audit scenario matrix (6360 scenarios)
        run: |
          node audit/run.js
          PYTHONPATH=backend python3 audit/relay.py
