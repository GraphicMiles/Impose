# Nightly logical backup — the $0 stand-in for managed backups (which are
# Pro-plan features on Supabase). Runs pg_dump against the project's direct
# connection string and keeps 30 days of artifacts. Restore drill: create a
# scratch free-tier project, pg_restore this dump into it, run the parity
# catalog queries from docs/DATABASE.md (golden rules + table digest).
#
# Required repo secret:
#   SUPABASE_DB_URL — postgres://postgres.<ref>:<password>@aws-0-eu-west-2.pooler.supabase.com:5432/postgres
#   (Dashboard → Project Settings → Database → Connection string → "Direct
#   connection" is preferred for pg_dump; the session-mode pooler DSN also
#   works. The password is the database password set at project creation.)
name: db-backup

on:
  schedule:
    - cron: "37 3 * * *" # nightly, staggered off the DB's own cron jobs
  workflow_dispatch:

permissions:
  contents: none

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Install PostgreSQL 17 client tools
        # Supabase runs Postgres 17.6; ubuntu-latest ships pg_dump 16,
        # which refuses ("server version mismatch"). Pin the PGDG repo.
        run: |
          set -euo pipefail
          sudo apt-get -yqq install wget gnupg lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          wget -qO- https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --batch --yes --dearmor -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get -yqq update -o Dir::Etc::sourcelist="sources.list.d/pgdg.list"
          sudo apt-get -yqq install postgresql-client-17
          pg_dump --version
      - name: pg_dump (custom format)
        run: |
          set -euo pipefail
          mkdir -p out
          pg_dump "$SUPABASE_DB_URL" \
            --format=custom --compress=6 \
            --schema=public --schema=auth \
            --file="out/impose-$(date -u +%Y-%m-%d).dump"
          ls -la out/
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGCONNECT_TIMEOUT: "30"
      - name: Upload artifact (30-day retention)
        uses: actions/upload-artifact@v4
        with:
          name: impose-db-dump
          path: out/
          retention-days: 30
          if-no-files-found: error
